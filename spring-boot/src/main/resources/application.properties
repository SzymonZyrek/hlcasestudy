# Port 8081 lets the Spring variant run alongside WildFly on 8080.
server.port=8081

# Self-contained comparison; original Jakarta app uses WildFly's ExampleDS.
spring.datasource.url=jdbc:h2:mem:hlcase;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Demo only. Hibernate will execute classpath:/import.sql after schema creation.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Uncomment to inspect the SQL generated by Hibernate:
# logging.level.org.hibernate.SQL=DEBUG
