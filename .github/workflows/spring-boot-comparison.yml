name: Spring Boot comparison
on:
  push:
    branches:
      - comparison/spring-boot-4
  pull_request:
    paths:
      - 'spring-boot/**'
      - '.github/workflows/spring-boot-comparison.yml'
  workflow_dispatch:

jobs:
  verify-spring-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: spring-boot/pom.xml
      - name: Maven verify
        run: mvn -B -ntp -f spring-boot/pom.xml clean verify
